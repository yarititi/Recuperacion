<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Cita - Profesional</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #7c3aed;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --light: #f8fafc;
            --dark: #1e293b;
            --text: #334155;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            padding-top: 80px;
            min-height: 100vh;
            line-height: 1.6;
        }

        .navbar {
            background: #1e293b;
            padding: 12px 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .navbar-nav {
            display: flex;
            gap: 1rem;
            list-style: none;
            align-items: center;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .nav-link:hover, .nav-link.active {
            background: #374151;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }

        .btn-primary {
            background: #2563eb;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-success {
            background: #10b981;
        }

        .btn-success:hover {
            background: #0da271;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #ef4444;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 2rem 0;
            border-bottom: 2px solid #e2e8f0;
        }

        .page-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            color: #64748b;
            font-size: 1.1rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .info-grid {
            display: grid;
            gap: 1.5rem;
        }

        .info-item {
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.5rem;
            display: block;
        }

        .info-value {
            color: #64748b;
            font-size: 1.1rem;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .status-pending {
            background: #fef3c7;
            color: #d97706;
        }

        .status-confirmed {
            background: #d1fae5;
            color: #065f46;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #dc2626;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            body {
                padding-top: 100px;
            }
            
            .nav-container {
                flex-direction: column;
                gap: 1rem;
            }
            
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a class="navbar-brand" th:href="@{/profesional/dashboard}">
                <i class="fas fa-hospital"></i>
                Clínica Médica
            </a>
            <ul class="navbar-nav">
                <li><a class="nav-link" th:href="@{/profesional/dashboard}">
                    <i class="fas fa-home"></i> Dashboard
                </a></li>
                <li><a class="nav-link active" th:href="@{/profesional/citas}">
                    <i class="fas fa-calendar-alt"></i> Mis Citas
                </a></li>
                <li><a class="nav-link" th:href="@{/profesional/pacientes}">
                    <i class="fas fa-users"></i> Pacientes
                </a></li>
                <li><a class="nav-link" th:href="@{/profesional/horarios}">
                    <i class="fas fa-clock"></i> Horarios
                </a></li>
                <li><span class="nav-link" style="color: #60a5fa;">
                    <i class="fas fa-user-md"></i>
                    <span th:text="${profesional.usuario.nombre}">Profesional</span>
                </span></li>
                <li>
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1 class="page-title">
                    <i class="fas fa-calendar-check"></i>
                    Detalle de Cita
                </h1>
                <p class="page-subtitle">
                    Información completa de la cita médica
                </p>
            </div>
            <a th:href="@{/profesional/citas}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i>
                Volver a Mis Citas
            </a>
        </div>

        <!-- Alert Messages -->
        <div th:if="${success}" style="background: #f0fdf4; color: #16a34a; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; border-left: 4px solid #16a34a;">
            <i class="fas fa-check-circle"></i>
            <span th:text="${success}"></span>
        </div>

        <div th:if="${error}" style="background: #fef2f2; color: #dc2626; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; border-left: 4px solid #dc2626;">
            <i class="fas fa-exclamation-triangle"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- Cita Details Card -->
        <div class="card">
            <div class="info-grid">
                <!-- Paciente -->
                <div class="info-item">
                    <span class="info-label">
                        <i class="fas fa-user"></i> Paciente
                    </span>
                    <div class="info-value" th:text="${cita.usuario.nombre}"></div>
                </div>
                
                <!-- Servicio -->
                <div class="info-item">
                    <span class="info-label">
                        <i class="fas fa-stethoscope"></i> Servicio Médico
                    </span>
                    <div class="info-value" th:text="${cita.servicio.nombre}"></div>
                </div>
                
                <!-- Fecha y Hora -->
                <div class="info-item">
                    <span class="info-label">
                        <i class="fas fa-clock"></i> Fecha y Hora
                    </span>
                    <div class="info-value" th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}"></div>
                </div>
                
                <!-- Estado -->
                <div class="info-item">
                    <span class="info-label">
                        <i class="fas fa-info-circle"></i> Estado
                    </span>
                    <div class="info-value">
                        <span th:if="${cita.estado == 'PENDIENTE'}" class="status-badge status-pending">
                            <i class="fas fa-clock"></i> PENDIENTE
                        </span>
                        <span th:if="${cita.estado == 'CONFIRMADA'}" class="status-badge status-confirmed">
                            <i class="fas fa-check"></i> CONFIRMADA
                        </span>
                        <span th:if="${cita.estado == 'CANCELADA'}" class="status-badge status-cancelled">
                            <i class="fas fa-times"></i> CANCELADA
                        </span>
                    </div>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="action-buttons">
                <a th:href="@{/profesional/citas}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Volver al Listado
                </a>
                <form th:action="@{/profesional/citas/{id}/confirmar(id=${cita.id})}" method="post" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-success"
                            th:if="${cita.estado == 'PENDIENTE'}"
                            onclick="return confirm('¿Confirmar esta cita?')">
                        <i class="fas fa-check"></i> Confirmar Cita
                    </button>
                </form>
                <form th:action="@{/profesional/citas/{id}/cancelar(id=${cita.id})}" method="post" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-danger"
                            th:if="${cita.estado != 'CANCELADA'}"
                            onclick="return confirm('¿Cancelar esta cita?')">
                        <i class="fas fa-times"></i> Cancelar Cita
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
