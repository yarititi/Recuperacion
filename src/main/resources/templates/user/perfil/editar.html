<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Usuario</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .form-card {
            background: white;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        .buttons-container {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 10px;
            margin: 2rem 0;
            text-align: center;
        }
        .btn-custom {
            padding: 12px 30px;
            margin: 0 10px;
            min-width: 160px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/user/dashboard}">
                <i class="fas fa-hospital"></i> Clínica Médica
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/user/dashboard}">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a class="nav-link" th:href="@{/user/citas/listar}">
                    <i class="fas fa-calendar-alt"></i> Mis Citas
                </a>
                <a class="nav-link active" th:href="@{/user/perfil/ver}">
                    <i class="fas fa-user"></i> Mi Perfil
                </a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="profile-container">
        <!-- Header -->
        <div class="profile-header text-center">
            <div class="profile-avatar">
                <i class="fas fa-user-edit"></i>
            </div>
            <h2>Editar Perfil</h2>
            <p class="mb-0">Actualiza tu información personal</p>
        </div>

        <!-- Alert Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- FORMULARIO CORREGIDO CON LA RUTA CORRECTA -->
        <form th:action="@{/user/perfil/actualizar}" method="post" class="needs-validation" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            
            <div class="form-card">
                <h4 class="mb-4">
                    <i class="fas fa-user-edit text-primary me-2"></i> Información Personal
                </h4>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nombre" class="form-label">Nombre Completo *</label>
                        <input type="text" 
                               class="form-control" 
                               id="nombre"
                               name="nombre"
                               th:value="${usuario.nombre}"
                               required
                               placeholder="Ingresa tu nombre completo">
                        <div class="invalid-feedback">
                            Por favor ingresa tu nombre completo.
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" 
                               class="form-control" 
                               id="email"
                               th:value="${usuario.email}"
                               disabled>
                        <small class="form-text text-muted">
                            El email no se puede modificar.
                        </small>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="tel" 
                               class="form-control" 
                               id="telefono"
                               name="telefono"
                               th:value="${usuario.telefono}"
                               placeholder="+57 300 123 4567">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha de Registro</label>
                        <input type="text" 
                               class="form-control" 
                               th:value="${#temporals.format(usuario.fechaRegistro, 'dd/MM/yyyy')}"
                               disabled>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <input type="text" 
                           class="form-control" 
                           th:value="${usuario.rol}"
                           disabled>
                </div>
            </div>

            <!-- BOTONES CORREGIDOS -->
            <div class="buttons-container">
                <div class="d-flex justify-content-center flex-wrap gap-3">
                    <a th:href="@{/user/perfil/ver}" class="btn btn-secondary btn-custom">
                        <i class="fas fa-times me-2"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-success btn-custom">
                        <i class="fas fa-save me-2"></i> Guardar Cambios
                    </button>
                    <a th:href="@{/user/perfil/cambiar-password}" class="btn btn-warning btn-custom">
                        <i class="fas fa-key me-2"></i> Cambiar Contraseña
                    </a>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Validación de formulario
        (function() {
            'use strict';
            var forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function(form) {
                form.addEventListener('submit', function(event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();

        // Mostrar loading al enviar
        document.querySelector('form').addEventListener('submit', function(e) {
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Guardando...';
            submitBtn.disabled = true;
        });
    </script>
</body>
</html>
