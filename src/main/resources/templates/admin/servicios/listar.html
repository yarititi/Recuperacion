<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Gestión de Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin/dashboard">🏥 Admin Clínica</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/dashboard">Inicio</a>
                <a class="nav-link" href="/logout">Cerrar Sesión</a>
            </div>
        </div>
    </nav>
    <section class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Servicios</h2>
            <a th:href="@{/admin/servicios/nuevo}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nuevo Servicio
            </a>
        </div>

        <!-- Mensajes de éxito/error -->
        <div th:if="${success}" class="alert alert-success" role="alert">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
        </div>

        <!-- Tabla de servicios -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Duración (min)</th>
                                <th>Precio</th>
                                <th>Categoría</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="servicio : ${servicios}" th:class="${servicio.activo} ? '' : 'table-secondary'">
                                <td th:text="${servicio.nombre}"></td>
                                <td th:text="${servicio.descripcion}"></td>
                                <td th:text="${servicio.duracionMinutos}"></td>
                                <td th:text="'$' + ${#numbers.formatDecimal(servicio.precio, 1, 2)}"></td>
                                <td>
                                    <span class="badge bg-primary" th:text="${servicio.categoria}"></span>
                                </td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/admin/servicios/editar/} + ${servicio.id}" 
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <a href="#" class="btn btn-sm btn-outline-danger"
                                           th:onclick="'confirmarEliminar(\'¿Está seguro de eliminar este servicio?\', \'/admin/servicios/eliminar/' + ${servicio.id} + '\'); return false;'">
                                            <i class="fas fa-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(servicios)}">
                                <td colspan="6" class="text-center">No hay servicios registrados</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        function confirmarEliminar(mensaje, url) {
            if (confirm(mensaje)) {
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
